<div class="stage">
  <div class="stage-copy">
    <div class="brand-mini"><span class="brand-dot"></span> ANXING <span class="brand-mini-cn">夜行安全系统</span></div>
    <h1>把每一段夜路，<br>走成有光的路。</h1>
    <p>真实定位 · 真实地点 · 真实路线。点击底部导航切换页面，中央「求救」可按危险程度选择共享位置或 SOS 报警。</p>

  </div>
